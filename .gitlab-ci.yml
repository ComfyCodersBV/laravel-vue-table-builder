stages:
  - test

vitest:
  stage: test
  image: node:22-alpine
  before_script:
    - npm ci
  script:
    - npm run typecheck
    - npm test
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
